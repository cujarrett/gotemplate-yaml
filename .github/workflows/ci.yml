name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate JSON
        run: |
          python3 -m json.tool syntaxes/gotemplate-yaml.tmLanguage.json > /dev/null
          python3 -m json.tool package.json > /dev/null

      # Packaging is the only real check here - it validates the manifest, the
      # icon and every path the grammar references.
      - name: Package
        run: npx --yes @vscode/vsce package

  publish:
    name: publish
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # A release is a version bump in package.json. Publishing any other push
      # would fail on a version the Marketplace already has, so check first and
      # let a real publish failure fail the job.
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          new=$(jq -r .version package.json)
          old=$(git show HEAD^:package.json | jq -r .version)
          if [ "$new" = "$old" ]; then
            echo "version still $new, nothing to publish"
            exit 0
          fi
          echo "publishing $old -> $new"
          npx --yes @vscode/vsce publish
