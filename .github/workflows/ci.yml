name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate JSON
        run: |
          python3 -m json.tool syntaxes/gotemplate-yaml.tmLanguage.json > /dev/null
          python3 -m json.tool package.json > /dev/null

      - name: Grammar snapshots
        run: npx --yes --package vscode-tmgrammar-test@0.1.3 vscode-tmgrammar-snap -s source.yaml -g test/grammars/yaml.tmLanguage.json -g test/grammars/yaml-1.2.tmLanguage.json -g test/grammars/yaml-embedded.tmLanguage.json 'test/fixtures/*.yaml'

      # Packaging validates the manifest, the
      # icon and every path the grammar references.
      - name: Package
        run: npx --yes @vscode/vsce package

  publish:
    name: publish
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # vsce runs the bundle step, which needs the dev dependencies.
      - run: npm ci

      # --skip-duplicate exits cleanly when the Marketplace already serves this
      # version, so every push to main can run this and only a real bump ships.
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --skip-duplicate
