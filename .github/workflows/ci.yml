name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate JSON
        run: |
          python3 -m json.tool syntaxes/gotemplate-yaml.tmLanguage.json > /dev/null
          python3 -m json.tool package.json > /dev/null

      # Packaging is the only real check here - it validates the manifest, the
      # icon and every path the grammar references.
      - name: Package
        run: npx --yes @vscode/vsce package

  publish:
    name: publish
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # --skip-duplicate exits cleanly when the Marketplace already serves this
      # version, so every push to main can run this and only a real bump ships.
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --skip-duplicate
